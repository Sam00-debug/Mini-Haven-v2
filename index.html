<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no"
    >

    <title>Mini Haven</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="game"></canvas>

<!-- Player information -->
<div id="playerInfo">Mini Haven</div>

<!-- Mobile joystick -->
<div id="joystick">
    <div id="joystickKnob"></div>
</div>

<!-- Zoom -->
<div id="zoomControls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">−</button>
</div>

    <!-- =====================================================
     MINI HAVEN CHAT
===================================================== -->

<button id="chatToggle" aria-label="Open chat">
    💬
</button>

<div id="gameChat">

    <div id="chatMessages"></div>

    <div id="chatInputBox">

        <input
            id="chatInput"
            type="text"
            maxlength="400"
            autocomplete="off"
            placeholder="Press ; to chat..."
        >

        <button id="chatSend">
            ➤
        </button>

    </div>

</div>

<script src="game.js"></script>

</body>
  </html>
