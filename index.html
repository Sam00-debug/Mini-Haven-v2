<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>Mini Haven</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         GAME CANVAS
    ====================================================== -->

    <canvas id="game"></canvas>

<div id="chatBubbles"></div>
    <!-- =====================================================
         PLAYER INFO
    ====================================================== -->

    <div id="playerInfo">
        Mini Haven
    </div>


    <!-- =====================================================
         MOVEMENT JOYSTICK
         LEFT SIDE
    ====================================================== -->

    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>


    <!-- =====================================================
         AIM JOYSTICK
         RIGHT SIDE

         This is normally invisible.
         game.js creates/positions it where the
         player touches/holds on the right side.
    ====================================================== -->

    <div
        id="aimJoystick"
        aria-hidden="true"
    >
        <div id="aimJoystickKnob"></div>
    </div>


    <!-- =====================================================
         ZOOM CONTROLS
    ====================================================== -->

    <div id="zoomControls">

        <button
            id="zoomIn"
            type="button"
            aria-label="Zoom in"
        >
            +
        </button>

        <button
            id="zoomOut"
            type="button"
            aria-label="Zoom out"
        >
            −
        </button>

    </div>


    <!-- =====================================================
         MINI HAVEN CHAT BUTTON
    ====================================================== -->

    <button
        id="chatToggle"
        type="button"
        aria-label="Open chat"
    >
        💬
    </button>


    <!-- =====================================================
         CHAT PANEL
    ====================================================== -->

    <div
        id="gameChat"
        aria-label="Mini Haven chat"
    >

        <!-- Scrollable message area -->

        <div
            id="chatMessages"
            role="log"
            aria-live="polite"
        ></div>


        <!-- Chat input -->

        <div id="chatInputBox">

            <input
                id="chatInput"
                type="text"
                maxlength="400"
                autocomplete="off"
                spellcheck="false"
                placeholder="Press ; to chat..."
            >

            <button
                id="chatSend"
                type="button"
                aria-label="Send message"
            >
                ➤
            </button>

        </div>

    </div>


    <!-- =====================================================
         GAME SCRIPT
    ====================================================== -->

    <script src="game.js"></script>

</body>
</html>
